name: agnix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: agnix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate agent configs
        id: agnix
        uses: agent-sh/agnix@v0
        with:
          path: '.'
          format: 'sarif'
          version: 'v0.59.0'
          fail-on-error: 'true'

      - name: Prepare SARIF for code scanning
        if: always() && steps.agnix.outputs.sarif-file != ''
        id: sarif
        env:
          SARIF_INPUT: ${{ steps.agnix.outputs.sarif-file }}
        run: |
          node --test scripts/prepare-agnix-sarif.test.mjs
          node scripts/prepare-agnix-sarif.mjs "$SARIF_INPUT" "$RUNNER_TEMP/agnix-upload.sarif"
          echo "file=$RUNNER_TEMP/agnix-upload.sarif" >> "$GITHUB_OUTPUT"

      - name: Upload SARIF results
        if: always() && steps.sarif.outcome == 'success'
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: ${{ steps.sarif.outputs.file }}
          category: agnix

      - name: Summarize findings
        if: always()
        env:
          RESULT: ${{ steps.agnix.outputs.result }}
          ERRORS: ${{ steps.agnix.outputs.errors }}
          WARNINGS: ${{ steps.agnix.outputs.warnings }}
        run: |
          {
            echo "### agnix"
            echo ""
            if [[ -z "$RESULT" || -z "$ERRORS" || -z "$WARNINGS" ]]; then
              echo "Validation did not complete or its results are unavailable. Check the job logs."
            else
              echo "| Severity | Count |"
              echo "| --- | --- |"
              echo "| Errors | $ERRORS |"
              echo "| Warnings | $WARNINGS |"
              echo ""
              echo "See the validation step for diagnostics and the SARIF upload step for code scanning status."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
