name: Registry CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect skill changes
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.diff.outputs.skills }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare changed paths
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A manual dispatch always runs the full audit. Job gating, not workflow
          # paths, keeps every check reporting on documentation-only pull requests.
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            echo 'skills=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA=$(git hash-object -t tree /dev/null)
          elif [[ "$EVENT_NAME" == pull_request ]]; then
            BASE_SHA=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          fi
          git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" -- skills/ > "$RUNNER_TEMP/changed-skills"
          if [[ -s "$RUNNER_TEMP/changed-skills" ]]; then
            echo 'skills=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skills=false' >> "$GITHUB_OUTPUT"
          fi

  registry:
    name: Generated output, validation and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check generated manifest and catalog
        run: npm run generate:check
      - name: Validate against the latest Nosey schemas
        run: npm run validate
      - name: Run the test suite
        run: npm test
      - name: Assert no uncommitted output
        run: test -z "$(git status --porcelain)"

  agnix:
    name: Agnix skill audit
    needs: changes
    if: needs.changes.outputs.skills == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit skills and agent configuration
        id: audit
        uses: agent-sh/agnix@182f69774807d9df7c82dcde8240ca0c595e7c83 # v0.59.1
        with:
          path: '.'
          version: v0.59.1
          fail-on-error: 'true'
      - name: Agnix summary
        if: always()
        env:
          ERRORS: ${{ steps.audit.outputs.errors }}
          WARNINGS: ${{ steps.audit.outputs.warnings }}
        run: |
          {
            echo '### Agnix skill audit'
            echo ''
            if [[ -n "$ERRORS" && -n "$WARNINGS" ]]; then
              echo '| Errors | Warnings |'
              echo '| ---: | ---: |'
              echo "| $ERRORS | $WARNINGS |"
            else
              echo 'Audit did not return counts; see the audit step logs.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
