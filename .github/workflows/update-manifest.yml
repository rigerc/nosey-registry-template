name: Update Nosey manifest and README

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'registry.json'
      - 'skills-manifest.json'
      - 'skills-map.json'
      - 'README.md'
      - 'scripts/**'
      - '.github/workflows/update-manifest.yml'
  pull_request:
    paths:
      - 'skills/**'
      - 'registry.json'
      - 'skills-manifest.json'
      - 'skills-map.json'
      - 'README.md'
      - 'scripts/**'
      - '.github/workflows/update-manifest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Test generators
        run: node --test scripts/*.test.mjs
      - name: Verify on pull requests
        if: github.event_name == 'pull_request'
        run: |
          node scripts/generate-manifest.mjs --check
          node scripts/generate-readme.mjs --check

  update:
    needs: manifest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: registry-generated-main
      cancel-in-progress: false
    steps:
      # Resolve main after acquiring the concurrency slot so queued runs use
      # the latest sources, including any preceding generated commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Test current generators
        run: node --test scripts/*.test.mjs
      - name: Generate manifest and README
        run: |
          node scripts/generate-manifest.mjs
          node scripts/generate-readme.mjs
          node scripts/generate-manifest.mjs --check
          node scripts/generate-readme.mjs --check
      - name: Commit generated files
        run: |
          if ! git diff --quiet -- skills-manifest.json README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add skills-manifest.json README.md
            git commit -m "chore: regenerate skills manifest and README"
            git push origin HEAD:main
          fi
