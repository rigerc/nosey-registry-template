name: Generate registry artifacts

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'skills-map.json'
      - 'scripts/generate-manifest.mjs'
      - 'scripts/generate-readme.mjs'
      - 'scripts/lib/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Regenerate manifest and catalog
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Regenerate manifest and catalog
        run: npm run generate
      - name: Commit generated artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -z "$(git status --porcelain -- skills-manifest.json README.md)" ]]; then
            echo 'Generated artifacts are current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skills-manifest.json README.md
          git commit -m 'chore(registry): regenerate manifest and catalog'
          git push
