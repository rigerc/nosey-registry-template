name: Update from Nosey registry template

on:
  schedule:
    - cron: '17 4 1 * *'
  workflow_dispatch:
    inputs:
      ref:
        description: Upstream branch or tag
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: template-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  propose:
    if: github.repository != 'rigerc/nosey-registry-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Require workflow-capable sync token
        env:
          SYNC_TOKEN: ${{ secrets.TEMPLATE_SYNC_TOKEN }}
        run: |
          if [[ -z "$SYNC_TOKEN" ]]; then
            echo '::error::TEMPLATE_SYNC_TOKEN needs Contents, Pull requests and Workflows write permissions.'
            exit 1
          fi
      - name: Merge template-managed files
        env:
          TEMPLATE_REF: ${{ inputs.ref || 'main' }}
        run: node scripts/template-update.mjs --ref "$TEMPLATE_REF"
      - name: Create reviewed update PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.TEMPLATE_SYNC_TOKEN }}
          branch: automation/nosey-template-sync
          delete-branch: true
          commit-message: 'chore(template): sync registry infrastructure'
          title: 'chore(template): update registry infrastructure'
          body: |
            Automated three-way update of template-managed infrastructure.
            Registry skills, identity, mappings, README and manifest remain downstream-owned.
            Review the diff and require registry CI and Agnix before merging.
