name: Update from Nosey registry template

on:
  schedule:
    - cron: '17 4 1 * *'
  workflow_dispatch:
    inputs:
      ref:
        description: Upstream template branch
        required: false
        default: main
        type: string
      dry_run:
        description: Preview changes without pushing a branch or opening a PR
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: template-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  propose:
    if: github.repository != 'rigerc/nosey-registry-template'
    runs-on: ubuntu-latest
    steps:
      - name: Validate sync configuration
        env:
          SYNC_TOKEN: ${{ secrets.TEMPLATE_SYNC_TOKEN }}
          TEMPLATE_REF: ${{ inputs.ref || 'main' }}
        run: |
          if [[ -z "$SYNC_TOKEN" ]]; then
            echo '::error::TEMPLATE_SYNC_TOKEN needs Contents, Pull requests and Workflows write permissions.'
            exit 1
          fi
          # The sync action interpolates the source branch into a shell command.
          if [[ ! "$TEMPLATE_REF" =~ ^[A-Za-z0-9_./-]+$ ]] ||
             ! git check-ref-format "refs/heads/$TEMPLATE_REF"; then
            echo '::error::Use a valid upstream branch containing only letters, numbers, underscores, dots, slashes and hyphens.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.TEMPLATE_SYNC_TOKEN }}
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require registry ownership policy
        run: |
          if [[ ! -s .templatesyncignore ]]; then
            echo '::error::Copy and commit .templatesyncignore from rigerc/nosey-registry-template before syncing.'
            exit 1
          fi
      - name: Create reviewed template update PR
        uses: AndreasAugustin/actions-template-sync@6e1d0089686f8940604fc15baae62367bf6ee860 # v2.6.0
        with:
          source_gh_token: ${{ github.token }}
          target_gh_token: ${{ secrets.TEMPLATE_SYNC_TOKEN }}
          source_repo_path: rigerc/nosey-registry-template
          source_branch: ${{ inputs.ref || 'main' }}
          upstream_branch: ${{ github.event.repository.default_branch }}
          template_sync_ignore_file_path: .templatesyncignore
          is_dry_run: ${{ inputs.dry_run || false }}
          pr_branch_name_prefix: automation/nosey-template-sync
          pr_commit_msg: 'chore(template): sync registry infrastructure'
          pr_title: 'chore(template): update registry infrastructure'
          pr_body: |
            Sync registry infrastructure from ${SOURCE_REPO} at ${TEMPLATE_GIT_HASH}.
            Registry skills, identity, mappings, README and manifest remain downstream-owned.
            Upstream changes win conflicts in synchronized files; review local customizations.
            Review the diff and require registry CI and Agnix before merging.
